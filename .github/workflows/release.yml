name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release the selected workflow ref as this exact vX.Y.Z tag
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      checkout_ref: ${{ steps.metadata.outputs.checkout_ref }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release hygiene
        run: scripts/check-release-hygiene.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - name: Validate tag and project versions
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must exactly match vX.Y.Z; received: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          package_version="$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          tauri_version="$(node -e "const fs = require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version)")"
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          cargo_version="$(node -e "const fs = require('fs'); const metadata = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const pkg = metadata.packages.find(({ manifest_path }) => manifest_path.endsWith('/src-tauri/Cargo.toml')); if (!pkg) process.exit(1); process.stdout.write(pkg.version)" "$RUNNER_TEMP/cargo-metadata.json")"

          for entry in \
            "package.json:$package_version" \
            "src-tauri/Cargo.toml:$cargo_version" \
            "src-tauri/tauri.conf.json:$tauri_version"; do
            file="${entry%%:*}"
            actual="${entry#*:}"
            if [[ "$actual" != "$version" ]]; then
              echo "$file version $actual does not match release tag $tag" >&2
              exit 1
            fi
          done

          release_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main; then
            echo "Release commit $release_sha is not part of main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$release_sha" ]]; then
              echo "Tag $tag already points to $tag_sha, not selected commit $release_sha" >&2
              exit 1
            fi
          fi

          {
            echo "checkout_ref=$release_sha"
            echo "release_sha=$release_sha"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Rust format
        run: cargo fmt --all -- --check
        working-directory: src-tauri
      - name: Rust clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --locked --all-targets
        working-directory: src-tauri

  build:
    name: Package ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            id: macos-x64
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            extension: .dmg
            asset_suffix: macos-x64.dmg
          - name: macOS Apple Silicon
            id: macos-arm64
            platform: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            extension: .dmg
            asset_suffix: macos-arm64.dmg
          - name: Windows x64
            id: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
            extension: .msi
            asset_suffix: windows-x64.msi
          - name: Linux x64
            id: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            extension: .AppImage
            asset_suffix: linux-x64.AppImage
    runs-on: ${{ matrix.platform }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Normalize release artifact
        shell: bash
        run: |
          node .github/scripts/collect-release-artifact.mjs \
            --bundle-dir "src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}" \
            --extension "${{ matrix.extension }}" \
            --output "release-assets/Signal-${{ needs.prepare.outputs.version }}-${{ matrix.asset_suffix }}"
      - name: Upload packaged installer
        uses: actions/upload-artifact@v4
        with:
          name: signal-release-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: signal-release-*
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected 4 normalized installers, found ${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          : > SHA256SUMS
          for asset in "${assets[@]}"; do
            sha256sum "$asset" >> SHA256SUMS
          done
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; create a new vX.Y.Z release instead" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "Signal $RELEASE_TAG" \
              --notes "Signal desktop installers for macOS, Windows and Linux. Assets are unsigned; verify downloads with SHA256SUMS. See https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md for details."
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$RELEASE_SHA" \
              --title "Signal $RELEASE_TAG" \
              --notes "Signal desktop installers for macOS, Windows and Linux. Assets are unsigned; verify downloads with SHA256SUMS. See https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md for details."
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
